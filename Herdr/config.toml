# -------------------------------------------------------------------------
# Program: config.toml
# Description: Configure Herdr appearance and keyboard shortcuts
# Context: Herdr terminal pane keybindings
# Author: Greg Tate
# ------------------------------------------------------------------------
onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[ui]
host_cursor = "native"
sidebar_collapsed_mode = "hidden"
sidebar_start_collapsed = true

# Configure Herdr's prefix and vertical pane split shortcut.
status_indicators = "symbols"
[keys]
prefix = "ctrl+backtick"
split_vertical = "prefix+|"
previous_workspace = "prefix+up"
next_workspace = "prefix+down"
switch_workspace = "prefix+shift+1..9"

# Move active tab left or right
move_tab_previous = "prefix+shift+left"
move_tab_next = "prefix+shift+right"

# Terminal settings
[terminal]
default_shell = 'C:\Users\gregt\AppData\Local\Microsoft\WindowsApps\pwsh.exe'
new_cwd = "follow"

[ui.toast]
delivery = "herdr"
