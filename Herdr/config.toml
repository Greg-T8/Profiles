# -------------------------------------------------------------------------
# Program: config.toml
# Description: Configure Herdr appearance and keyboard shortcuts
# Context: Herdr terminal pane keybindings
# Author: Greg Tate
# ------------------------------------------------------------------------
onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[ui]
host_cursor = "native"
sidebar_collapsed_mode = "hidden"
sidebar_start_collapsed = true

# Configure Herdr's prefix and vertical pane split shortcut.
status_indicators = "symbols"
[keys]
prefix = "ctrl+backtick"
split_vertical = "prefix+|"

# Terminal settings
[terminal]
new_cwd = "follow"

[ui.toast]
delivery = "herdr"
